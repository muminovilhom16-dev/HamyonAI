name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hamyon
          POSTGRES_PASSWORD: hamyon
          POSTGRES_DB: hamyon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hamyon" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://hamyon:hamyon@localhost:5432/hamyon
      TEST_DATABASE_URL: postgres://hamyon:hamyon@localhost:5432/hamyon_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: psql postgres://hamyon:hamyon@localhost:5432/hamyon -c "CREATE DATABASE hamyon_test"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node apps/api/dist/migrate.js
      - run: node scripts/smoke.mjs
