# Local development dependencies.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hamyon
      POSTGRES_PASSWORD: hamyon
      POSTGRES_DB: hamyon
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamyon"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
